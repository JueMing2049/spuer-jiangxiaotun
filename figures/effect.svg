<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="效果图骨架：设备框与三个区域及标注">
  <rect width="960" height="540" fill="#fbfbf9"/>
  <defs>
    <style>
      .ink{fill:none;stroke:#2b2b2b;stroke-width:1.5}
      .box{fill:#ffffff;stroke:#2b2b2b;stroke-width:1.6}
      .soft{fill:#f2f2ec;stroke:#c9c9c0;stroke-width:1}
      .acc{fill:none;stroke:#0f7a6d;stroke-width:2}
      .dash{fill:none;stroke:#6b6b6b;stroke-width:1.3;stroke-dasharray:5 4}
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#2b2b2b}
      .s{font-size:12px;fill:#6b6b6b}
      .m{font-family:Consolas,monospace;font-size:11px;fill:#0f7a6d}
      .ttl{font-size:13px;fill:#4a4a4a}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="40" y="36" class="ttl">效果图骨架 · 先框出区域，再谈视觉</text>

  <!-- 设备外框 -->
  <rect x="330" y="60" width="300" height="440" rx="16" class="box"/>
  <rect x="330" y="60" width="300" height="58" rx="16" class="soft"/>
  <rect x="330" y="100" width="300" height="18" class="soft" stroke="none"/>

  <!-- 区域 A -->
  <rect x="352" y="132" width="256" height="86" rx="8" class="soft"/>
  <text x="368" y="164">区域 A · 意图输入</text>
  <text x="368" y="186" class="s">一句话说清要什么</text>

  <!-- 区域 B -->
  <rect x="352" y="234" width="256" height="150" rx="8" class="soft"/>
  <text x="368" y="266">区域 B · 回合与内容</text>
  <text x="368" y="288" class="s">一屏之内看完本轮结果</text>

  <!-- 区域 C -->
  <rect x="352" y="400" width="256" height="76" rx="8" class="soft"/>
  <text x="368" y="432">区域 C · 输入与发送</text>
  <text x="368" y="454" class="s">唯一的主操作</text>

  <text x="352" y="118" class="s">顶部 · 标题与状态</text>

  <!-- 标注引线 -->
  <path d="M608 158 L700 158" class="dash"/>
  <text x="712" y="162" class="m">给谁看</text>
  <path d="M608 300 L700 300" class="dash"/>
  <text x="712" y="304" class="m">答什么问</text>
  <path d="M608 436 L700 436" class="dash"/>
  <text x="712" y="440" class="m">明确不答什么</text>

  <!-- 左侧提示 -->
  <text x="40" y="150" class="s">三个区域够用即可，</text>
  <text x="40" y="172" class="s">不要先雕细节。</text>
  <path d="M40 196 L40 250" class="ink" marker-end="url(#a)"/>

  <!-- 角标 -->
  <rect x="740" y="470" width="180" height="34" rx="17" class="acc"/>
  <text x="762" y="492" class="m">80% 预览 · 占位</text>
</svg>
