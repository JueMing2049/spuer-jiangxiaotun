<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="流程图骨架：输入到验收的主链与失败重试分支">
  <rect width="960" height="540" fill="#fbfbf9"/>
  <defs>
    <style>
      .ink{fill:none;stroke:#2b2b2b;stroke-width:1.5}
      .box{fill:#ffffff;stroke:#2b2b2b;stroke-width:1.6}
      .acc{fill:none;stroke:#0f7a6d;stroke-width:2}
      .dash{fill:none;stroke:#b06a2c;stroke-width:1.4;stroke-dasharray:5 4}
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#2b2b2b}
      .s{font-size:12px;fill:#6b6b6b}
      .m{font-family:Consolas,monospace;font-size:11px;fill:#0f7a6d}
      .w{font-family:Consolas,monospace;font-size:11px;fill:#b06a2c}
      .ttl{font-size:13px;fill:#4a4a4a}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <text x="40" y="36" class="ttl">流程图骨架 · 谁在什么时候做什么</text>

  <!-- 主链 -->
  <circle cx="62" cy="220" r="26" class="box"/>
  <text x="50" y="225" class="s">开始</text>

  <rect x="112" y="188" width="126" height="64" rx="8" class="box"/>
  <text x="132" y="216">用户输入</text>
  <text x="132" y="236" class="s">意图 + 约束</text>

  <rect x="262" y="188" width="126" height="64" rx="8" class="box"/>
  <text x="282" y="216">应用校验</text>
  <text x="282" y="236" class="s">结构 / 长度</text>

  <rect x="412" y="188" width="126" height="64" rx="8" class="box"/>
  <text x="432" y="216">AI 决策</text>
  <text x="432" y="236" class="s">单角色或团队</text>

  <rect x="562" y="188" width="126" height="64" rx="8" class="box"/>
  <text x="582" y="216">渲染回合</text>
  <text x="582" y="236" class="s">逐条展示</text>

  <rect x="712" y="188" width="126" height="64" rx="8" class="acc"/>
  <text x="726" y="216">验收</text>
  <text x="726" y="236" class="s">对照图与清单</text>

  <circle cx="898" cy="220" r="26" class="box"/>
  <text x="886" y="225" class="s">结束</text>

  <path d="M88 220 L110 220" class="ink" marker-end="url(#a)"/>
  <path d="M238 220 L260 220" class="ink" marker-end="url(#a)"/>
  <path d="M388 220 L410 220" class="ink" marker-end="url(#a)"/>
  <path d="M538 220 L560 220" class="ink" marker-end="url(#a)"/>
  <path d="M688 220 L710 220" class="ink" marker-end="url(#a)"/>
  <path d="M838 220 L870 220" class="ink" marker-end="url(#a)"/>

  <!-- 失败分支 -->
  <rect x="412" y="344" width="126" height="56" rx="8" class="box"/>
  <text x="440" y="368" class="w">重试</text>
  <text x="432" y="388" class="s">复用同一会话</text>

  <path d="M475 254 L475 342" class="dash" marker-end="url(#w)"/>
  <text x="484" y="300" class="w">超时 / 失败</text>

  <path d="M412 372 L300 372 L300 254" class="dash" marker-end="url(#w)"/>
  <text x="300" y="392" class="w">只重发当前增量</text>

  <!-- 分层标注 -->
  <path d="M40 470 L920 470" class="ink"/>
  <text x="40" y="496" class="s">应用层（页面 + 同源接口）</text>
  <text x="380" y="496" class="s">模型层（WorkSwarm 会话）</text>
  <text x="720" y="496" class="s">人（验收）</text>
  <text x="40" y="120" class="s">每一步都要能回到图上的位置；回不来的，就是多余的步骤。</text>
</svg>
